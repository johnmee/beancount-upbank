[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "beancount-upbank"
version = "0.1.0"
description = "Import Up Bank (Australia) transactions into Beancount, and tidy up pending ones once they settle."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Mee" }]
keywords = ["beancount", "beangulp", "up", "up bank", "australia", "importer", "accounting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "beancount>=3.2.3",
    "beangulp>=0.2.0",
    "click>=8.2",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/johnmee/beancount-upbank"
Issues = "https://github.com/johnmee/beancount-upbank/issues"
Changelog = "https://github.com/johnmee/beancount-upbank/blob/main/CHANGELOG.md"

[project.scripts]
upbank = "beancount_upbank.cli:cli"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pyright>=1.1.414",
    "pytest>=8",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/beancount_upbank"]

[tool.hatch.build.targets.sdist]
# Only what builds and tests the package; nothing from a developer's checkout.
include = ["src", "tests", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
# The tests are type-checked, but need not be annotated.
module = [
    "conftest",
    "test_cli",
    "test_client",
    "test_dedup",
    "test_importer",
    "test_reconcile",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# beangulp ships no type information.
module = ["beangulp", "beangulp.*"]
ignore_missing_imports = true

[tool.ruff.format]
# Ruff formats Markdown code blocks too, and would collapse the README's
# column-aligned comments.
exclude = ["README.md"]

[tool.ruff.lint]
# On top of Ruff's defaults: import sorting, and bugbear's likely-bug checks.
extend-select = ["I", "B"]
